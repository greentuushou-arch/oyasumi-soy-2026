<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>枕と眠りのおやすみショップ SOY2026 投票バナー 1600×311</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<style>
@page{size:1600px 311px;margin:0}
:root{--night:#142c50;--navy:#1e3f6b;--blue:#3f6db0;--sky:#b9d0f0;--moon:#f7d774;--moon-d:#c98f1a;--ink:#1d2f4a;--moon-grad:linear-gradient(180deg,#ffe9a6 0%,#f7d774 55%,#eebf4f 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:311px;overflow:hidden;background:var(--night)}
body{font-family:"Noto Sans JP",sans-serif;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bn{position:relative;width:1600px;height:311px;overflow:hidden;display:grid;grid-template-columns:300px 1fr 700px;column-gap:14px;align-items:center;padding:0 34px 0 14px;background:linear-gradient(100deg,#142c50 0%,#1e3f6b 42%,#3f6db0 100%)}
.star{position:absolute;background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
.moon{position:absolute;left:26px;top:30px;width:62px;height:62px;border-radius:50%;box-shadow:inset -16px 5px 0 0 var(--moon);transform:rotate(-16deg)}
.l,.c,.r{position:relative;z-index:1}
.l{height:311px}
.box{position:absolute;left:92px;bottom:4px;width:206px;height:auto;display:block}
.sheep{position:absolute;left:2px;bottom:14px;width:100px;height:83px}
.c{text-align:center}
.c .soy{font-family:"Jost",sans-serif;font-weight:500;font-size:24px;letter-spacing:.12em;color:var(--sky);white-space:nowrap}
.c .soy b{font-weight:600;font-size:1.35em;letter-spacing:.06em;margin-left:.3em;color:var(--moon)}
.c .ttl{font-weight:700;font-size:104px;line-height:1.1;white-space:nowrap;margin-top:2px}
.c .shop{display:inline-block;margin-top:6px;font-weight:700;font-size:24px;letter-spacing:.06em;padding:2px 18px;border-top:1.5px solid rgba(185,208,240,.6);border-bottom:1.5px solid rgba(185,208,240,.6);white-space:nowrap}
.pt{background:#fff;color:var(--ink);border-radius:16px;padding:12px 22px 16px;text-align:center;line-height:1.35;white-space:nowrap}
.pt .a{font-weight:700;font-size:46px}
.pt .a b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.5em;color:var(--blue)}
.pt .a small{font-size:.75em}
.pt .b{font-weight:700;font-size:35px;margin-top:4px}
.pt .b b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.25em;color:var(--blue)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;white-space:nowrap}
.dl{font-weight:700;font-size:26px}
.dl b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.4em;color:var(--moon)}
.cta{display:inline-flex;align-items:center;gap:10px;border-radius:999px;background:var(--moon-grad);color:var(--night);font-weight:700;font-size:30px;letter-spacing:.08em;padding:12px 14px 12px 34px;box-shadow:0 5px 0 var(--moon-d)}
.cta i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-size:15px}
</style>
</head>
<body>
<div class="bn" id="bn">
  <span class="moon"></span>
  <div class="l">
    <!-- ページと同じふっくらした投票箱（封筒が投入口に入るところ） -->
    <svg class="box" viewBox="12 -42 226 272" aria-hidden="true">
      <defs>
        <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3ebf7"/></linearGradient>
        <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
        <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c3d2e8"/><stop offset="1" stop-color="#a5b9d8"/></linearGradient>
        <clipPath id="slot"><rect x="0" y="-60" width="260" height="121"/></clipPath>
      </defs>
      <ellipse cx="128" cy="222" rx="118" ry="7" fill="rgba(10,24,48,.45)"/>
      <path d="M184 76 Q206 58 222 52 Q230 49 230 60 L230 178 Q230 190 220 196 Q202 206 186 212 Z" fill="url(#gSide)"/>
      <rect x="22" y="68" width="166" height="148" rx="22" fill="url(#gFront)"/>
      <rect x="30" y="76" width="150" height="132" rx="16" fill="none" stroke="#b9d0f0" stroke-width="1.6" stroke-dasharray="5 5"/>
      <circle cx="104" cy="120" r="26" fill="#1e3f6b"/>
      <path d="M112 102a19 19 0 1 0 9 31 16 16 0 0 1-9-31z" fill="#f7d774"/>
      <text x="104" y="170" text-anchor="middle" font-family="Jost,sans-serif" font-weight="600" font-size="24" letter-spacing="4" fill="#1e3f6b">VOTE</text>
      <text x="104" y="190" text-anchor="middle" font-family="Jost,sans-serif" font-weight="500" font-size="9.5" letter-spacing="1.6" fill="#3f6db0">SHOP OF THE YEAR 2026</text>
      <path d="M38 70 Q28 70 34 62 L60 48 Q66 44 74 44 L214 44 Q226 44 218 52 L192 68 Q188 70 182 70 Z" fill="url(#gTop)"/>
      <polygon points="48,64 112,64 120,58 56,58" fill="#142c50" stroke="#142c50" stroke-width="1.5" stroke-linejoin="round"/>
      <g clip-path="url(#slot)">
        <g transform="translate(55 -26)">
          <rect x="1" y="1" width="56" height="88" rx="4" fill="#ffffff" stroke="#c9d6ea" stroke-width="1.5"/>
          <path d="M2 3 L29 23 L56 3" fill="none" stroke="#c9d6ea" stroke-width="1.5"/>
          <circle cx="29" cy="23" r="8" fill="#1e3f6b"/>
          <path d="M31.5 17.5a6 6 0 1 0 2.8 9.6 5 5 0 0 1-2.8-9.6z" fill="#f7d774"/>
        </g>
      </g>
    </svg>
    <!-- 羊 -->
    <svg class="sheep" viewBox="0 0 120 100" aria-hidden="true">
      <g fill="#5b7aad"><rect x="34" y="72" width="8" height="22" rx="4"/><rect x="50" y="74" width="8" height="20" rx="4"/><rect x="68" y="74" width="8" height="20" rx="4"/><rect x="84" y="72" width="8" height="22" rx="4"/></g>
      <g fill="#ffffff"><circle cx="40" cy="46" r="20"/><circle cx="62" cy="36" r="22"/><circle cx="86" cy="46" r="20"/><circle cx="46" cy="64" r="18"/><circle cx="70" cy="66" r="19"/><circle cx="92" cy="60" r="14"/></g>
      <g fill="#5b7aad"><ellipse cx="26" cy="50" rx="17" ry="19"/><ellipse cx="9" cy="42" rx="9" ry="5" transform="rotate(-24 9 42)"/></g>
      <circle cx="27" cy="33" r="11" fill="#ffffff"/>
      <path d="M15 50q4 4 8 0M29 50q4 4 8 0" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M22 60q4 3 8 0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="c">
    <p class="soy">RAKUTEN SHOP OF THE YEAR<b>2026</b></p>
    <p class="ttl">投票受付中</p>
    <p class="shop">枕と眠りのおやすみショップ</p>
  </div>

  <div class="r">
    <div class="pt">
      <p class="a">最大<b>10,000</b><small>ポイント</small>！</p>
      <p class="b">合計<b>10</b>万名様に当たる！</p>
    </div>
    <div class="meta"><p class="dl">投票は<b>11.30</b>(月)09:59まで</p><span class="cta">投票はこちら<i>▶</i></span></div>
  </div>
</div>
<script>
(function(){
  // 背景の星
  var bn = document.getElementById('bn');
  [[1,8,16],[23,10,12],[30,84,14],[47,6,10],[46,90,12],[58,4,14],[20,48,10],[99,6,12],[98,92,14]].forEach(function(p){
    var s = document.createElement('span'); s.className = 'star';
    s.style.cssText = 'left:' + p[0] + '%;top:' + p[1] + '%;width:' + p[2] + 'px;height:' + p[2] + 'px';
    bn.insertBefore(s, bn.firstChild);
  });
  // ?w=2000 のように幅を指定すると、縦横比を保ったまま拡大する
  var m = location.search.match(/w=(\d+)/);
  if (!m) return;
  var Z = +m[1] / 1600, W = Math.ceil(1600 * Z), H = Math.ceil(311 * Z);
  bn.style.zoom = Z;
  var st = document.createElement('style');
  st.textContent = '@page{size:' + W + 'px ' + H + 'px;margin:0}html,body{width:' + W + 'px;height:' + H + 'px}';
  document.head.appendChild(st);
})();
</script>
</body>
</html>
